name: Lingua

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  android:
    name: Build Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Lingua-Android
          path: build/app/outputs/flutter-apk/app-release.apk

  linux:
    name: Build Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux
        run: flutter build linux --release

      - name: Compress Linux build
        run: |
          tar -czf Lingua-Linux.tar.gz \
            -C build/linux/x64/release bundle

      - name: Upload Linux build
        uses: actions/upload-artifact@v4
        with:
          name: Lingua-Linux
          path: Lingua-Linux.tar.gz

  release:
    name: Create GitHub Release
    needs:
      - android
      - linux

    runs-on: ubuntu-latest

    steps:
      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: Lingua-Android
          path: release

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: Lingua-Linux
          path: release

      - name: Rename APK
        run: |
          mv release/app-release.apk release/Lingua-Android.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/Lingua-Android.apk
            release/Lingua-Linux.tar.gz
          generate_release_notes: true
